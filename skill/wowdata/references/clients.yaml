schema: wowdata.clients.v1
# Friendly names for the CDN product the user means. Pass the value straight to
# --product: the CLI resolves the aliases listed under cliAliases itself.
#
# A product ID names a reusable slot, not a fixed game. wow_classic_beta carried the
# Mists of Pandaria Classic beta (5.5.x) before and carries WoW Forever (1.60.x) now.
# The CLI therefore verifies an alias against the flavor of the build that actually
# resolves and fails with product_alias_mismatch rather than answering for a slot that
# has moved on. When that happens, read the label from `casc products` and follow it.
clients:
  retail: wow
  ptr: wowt
  正式服测试服: wowt
  "正式服 PTR": wowt
  ptr2: wowxptr
  beta: wow_beta
  classic: wow_classic
  怀旧服: wow_classic
  classic-ptr: wow_classic_ptr
  "怀旧服 PTR": wow_classic_ptr
  怀旧服测试服: wow_classic_ptr
  classic-beta: wow_classic_beta
  classic-era: wow_classic_era
  怀中怀: wow_classic_era
  "60级": wow_classic_era
  香草服: wow_classic_era
  classic-era-ptr: wow_classic_era_ptr
  classic-anniversary: wow_anniversary
  classic-titan: wow_classic_titan
  泰坦服: wow_classic_titan
  泰坦重铸: wow_classic_titan
  时光服: wow_classic_titan
cliAliases:
  # The CLI resolves these to a product and checks the resolved build's flavor, so they
  # may be passed to --product directly.
  forever: wow_classic_beta
  classic-plus: wow_classic_beta
contextualAliases:
  硬核服:
    type: realm-rule
    products: [wow_classic_era, wow_anniversary]
    instruction: Do not treat as a product. Resolve the underlying classic-era or anniversary product from context; ask which one when unclear.
