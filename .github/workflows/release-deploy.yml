name: Release Deploy

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write

env:
  ARTIFACT_NAME: wowdata-linux-amd64
  REMOTE_APP_DIR: /opt/wowdata
  REMOTE_BIN: /opt/wowdata/bin/wowdata
  REMOTE_CACHE_DIR: /opt/wowdata/cache
  MCP_BIND_HOST: 127.0.0.1
  MCP_BIND_PORT: "9788"
  MCP_PUBLIC_BASE_URL: https://mcp.lychee-addon.online:9443
  MCP_SERVICE_NAME: wowdata-mcp
  MCP_NGINX_CONF: /etc/nginx/conf.d/wowdata-mcp.conf

jobs:
  build:
    name: Build release binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./... -count=1

      - name: Build Linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o "dist/${ARTIFACT_NAME}" ./cmd/wowdata

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/${{ env.ARTIFACT_NAME }}

      - name: Attach binary to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.ARTIFACT_NAME }}

  deploy:
    name: Deploy to MCP server
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: wowdata-linux-amd64
          path: dist

      - name: Configure SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.WOWDATA_DEPLOY_SSH_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/wowdata_deploy_key
          chmod 600 ~/.ssh/wowdata_deploy_key

      - name: Add host key
        env:
          DEPLOY_HOST: ${{ secrets.WOWDATA_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.WOWDATA_DEPLOY_PORT || '22' }}
        run: ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload binary
        env:
          DEPLOY_HOST: ${{ secrets.WOWDATA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.WOWDATA_DEPLOY_USER || 'root' }}
          DEPLOY_PORT: ${{ secrets.WOWDATA_DEPLOY_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/wowdata_deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '${REMOTE_APP_DIR}/bin' '${REMOTE_CACHE_DIR}'"
          scp -i ~/.ssh/wowdata_deploy_key -P "$DEPLOY_PORT" "dist/${ARTIFACT_NAME}" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/${ARTIFACT_NAME}"
          ssh -i ~/.ssh/wowdata_deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "install -m 0755 '/tmp/${ARTIFACT_NAME}' '${REMOTE_BIN}' && rm -f '/tmp/${ARTIFACT_NAME}'"

      - name: Configure systemd and nginx
        env:
          DEPLOY_HOST: ${{ secrets.WOWDATA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.WOWDATA_DEPLOY_USER || 'root' }}
          DEPLOY_PORT: ${{ secrets.WOWDATA_DEPLOY_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/wowdata_deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -euo pipefail

          cat >/etc/systemd/system/wowdata-mcp.service <<'UNIT'
          [Unit]
          Description=wowdata MCP Streamable HTTP server
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=/opt/wowdata
          ExecStart=/opt/wowdata/bin/wowdata --cache /opt/wowdata/cache mcp http --host 127.0.0.1 --port 9788 --base-url https://mcp.lychee-addon.online:9443
          Restart=always
          RestartSec=5
          NoNewPrivileges=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          UNIT

          # Retire previous Python MCP gateway units. The Go service above is the only supported MCP service.
          systemctl list-unit-files --type=service --no-legend \
            | awk '{print $1}' \
            | grep -E '(^|[-_])(wowdata|mcp).*([-_]|\.)(python|gateway)|(^|[-_])(python|gateway).*([-_]|\.)(wowdata|mcp)' \
            | while read -r unit; do
              [ -n "$unit" ] || continue
              systemctl disable --now "$unit" || true
            done

          systemctl list-units --type=service --all --no-legend \
            | awk '{print $1}' \
            | grep -E '(^|[-_])(wowdata|mcp).*([-_]|\.)(python|gateway)|(^|[-_])(python|gateway).*([-_]|\.)(wowdata|mcp)' \
            | while read -r unit; do
              [ -n "$unit" ] || continue
              systemctl stop "$unit" || true
            done

          systemctl daemon-reload
          systemctl enable --now wowdata-mcp.service
          systemctl restart wowdata-mcp.service

          cat >/etc/nginx/conf.d/wowdata-mcp.conf <<'NGINX'
          server {
              listen 9443 ssl http2;
              server_name mcp.lychee-addon.online;

              ssl_certificate /etc/letsencrypt/live/mcp.lychee-addon.online/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/mcp.lychee-addon.online/privkey.pem;
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_ciphers HIGH:!aNULL:!MD5;

              client_max_body_size 25m;
              proxy_read_timeout 300s;
              proxy_send_timeout 300s;

              location /mcp {
                  proxy_pass http://127.0.0.1:9788;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location /help {
                  proxy_pass http://127.0.0.1:9788;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location /health {
                  proxy_pass http://127.0.0.1:9788;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location / {
                  return 302 /help;
              }
          }
          NGINX

          nginx -t
          systemctl reload nginx
          REMOTE

      - name: Verify deployment
        env:
          DEPLOY_HOST: ${{ secrets.WOWDATA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.WOWDATA_DEPLOY_USER || 'root' }}
          DEPLOY_PORT: ${{ secrets.WOWDATA_DEPLOY_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/wowdata_deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "systemctl --no-pager --full status wowdata-mcp.service"
          curl --fail --show-error --silent --max-time 20 https://mcp.lychee-addon.online:9443/health
