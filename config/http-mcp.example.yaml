server:
  host: 127.0.0.1
  port: 9788
  base_url: http://211.154.18.253:11223

defaults:
  region: cn
  product: wow
  locale: zhCN

cache:
  root: /opt/wowdata/cache
  metadata_db: /opt/wowdata/cache/metadata.sqlite
  raw_dir: /opt/wowdata/cache/raw
  db2_dir: /opt/wowdata/cache/db2
  duckdb_path: /opt/wowdata/cache/duckdb/wowdata.duckdb
  casc_disk_limit_mb: 61440
  casc_disk_target_mb: 49152

artifacts:
  root: /opt/wowdata/output
  base_url: http://211.154.18.253:11223/files
  retention_hours: 24

prepare:
  lazy: true
  prewarm_on_start: true
  dbd_manifest: true
  listfile: false
  targets:
    - label: CN Retail
      region: cn
      product: wow
      locale: zhCN
    - label: CN Classic
      region: cn
      product: wow_classic
      locale: zhCN
    - label: CN Classic Titan
      region: cn
      product: wow_classic_titan
      locale: zhCN
    - label: CN Retail enUS
      region: cn
      product: wow
      locale: enUS
    - label: CN Classic enUS
      region: cn
      product: wow_classic
      locale: enUS
    - label: CN Retail PTR zhCN
      region: cn
      product: wowt
      locale: zhCN
    - label: CN Retail PTR enUS
      region: cn
      product: wowt
      locale: enUS
    - label: CN Classic PTR zhCN
      region: cn
      product: wow_classic_ptr
      locale: zhCN
    - label: CN Classic PTR enUS
      region: cn
      product: wow_classic_ptr
      locale: enUS
  default_tables:
    - "*"

refresh:
  product_check_interval_minutes: 30
  auto_prepare_new_builds: true
  keep_builds_per_product: 2
  prune_on_start: true
  max_cache_gb: 80

limits:
  max_parallel_context_prepares: 2
  max_parallel_table_materializations: 2
  max_parallel_downloads: 16
  max_parallel_queries: 16
  memory_soft_limit_mb: 4096
  memory_hard_limit_mb: 8192
  request_timeout_seconds: 120
  materialize_timeout_seconds: 600

tools:
  expose_admin_tools: false
  expose_debug_tools: false
