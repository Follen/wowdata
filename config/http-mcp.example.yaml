server:
  host: 127.0.0.1
  port: 9788
  base_url: http://211.154.18.253:11223

defaults:
  region: cn
  product: wow
  locale: zhCN

cache:
  root: /opt/wowdata/cache
  metadata_db: /opt/wowdata/cache/metadata.sqlite
  raw_dir: /opt/wowdata/cache/raw
  db2_dir: /opt/wowdata/cache/db2
  duckdb_path: /opt/wowdata/cache/duckdb/wowdata.duckdb

artifacts:
  root: /opt/wowdata/output
  base_url: http://211.154.18.253:11223/files
  retention_hours: 24

prepare:
  lazy: true
  prewarm_on_start: true
  dbd_manifest: true
  listfile: false
  targets:
    - label: CN Retail
      region: cn
      product: wow
      locale: zhCN
    - label: US Retail
      region: us
      product: wow
      locale: enUS
    - label: EU Retail
      region: eu
      product: wow
      locale: enUS
    - label: KR Retail
      region: kr
      product: wow
      locale: koKR
    - label: TW Retail
      region: tw
      product: wow
      locale: zhTW
    - label: CN PTR
      region: cn
      product: wowt
      locale: zhCN
    - label: US PTR
      region: us
      product: wowt
      locale: enUS
    - label: EU PTR
      region: eu
      product: wowt
      locale: enUS
    - label: CN Classic
      region: cn
      product: wow_classic
      locale: zhCN
    - label: US Classic
      region: us
      product: wow_classic
      locale: enUS
    - label: EU Classic
      region: eu
      product: wow_classic
      locale: enUS
    - label: KR Classic
      region: kr
      product: wow_classic
      locale: koKR
    - label: TW Classic
      region: tw
      product: wow_classic
      locale: zhTW
    - label: CN Classic Era
      region: cn
      product: wow_classic_era
      locale: zhCN
    - label: US Classic Era
      region: us
      product: wow_classic_era
      locale: enUS
    - label: EU Classic Era
      region: eu
      product: wow_classic_era
      locale: enUS
    - label: KR Classic Era
      region: kr
      product: wow_classic_era
      locale: koKR
    - label: TW Classic Era
      region: tw
      product: wow_classic_era
      locale: zhTW
    - label: CN Classic Titan
      region: cn
      product: wow_classic_titan
      locale: zhCN
    - label: US Classic Titan
      region: us
      product: wow_classic_titan
      locale: enUS
    - label: EU Classic Titan
      region: eu
      product: wow_classic_titan
      locale: enUS
    - label: KR Classic Titan
      region: kr
      product: wow_classic_titan
      locale: koKR
    - label: TW Classic Titan
      region: tw
      product: wow_classic_titan
      locale: zhTW
  default_tables:
    - SpellName
    - Spell
    - SpellEffect
    - SpellMisc
    - Item
    - ItemSparse
    - ItemEffect
    - ItemModifiedAppearance
    - ItemAppearance
    - ItemDisplayInfo
    - TextureFileData
    - ModelFileData
    - CreatureDisplayInfo
    - CreatureModelData
    - HouseDecor

refresh:
  product_check_interval_minutes: 30
  auto_prepare_new_builds: true
  keep_builds_per_product: 2
  prune_on_start: true
  max_cache_gb: 80

limits:
  max_parallel_context_prepares: 2
  max_parallel_table_materializations: 2
  max_parallel_downloads: 16
  max_parallel_queries: 16
  memory_soft_limit_mb: 4096
  memory_hard_limit_mb: 8192
  request_timeout_seconds: 120
  materialize_timeout_seconds: 600

tools:
  expose_admin_tools: false
  expose_debug_tools: false
